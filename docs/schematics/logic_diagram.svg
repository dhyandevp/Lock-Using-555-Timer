<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#475569" />
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#dc2626" />
    </marker>
    <marker id="arrowhead-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="480" y="38" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Hardware Logic &amp; Operational Flow</text>
  <text x="480" y="58" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Pure Combinational Input Logic with Monostable State Transition</text>

  <!-- Series Input Block (AND condition) -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="150" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="115" y="26" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">VALID CODE LOGIC</text>
    <text x="115" y="44" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">Series Connection (AND)</text>
    
    <rect x="15" y="56" width="200" height="78" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="25" y="76" font-size="11" font-weight="500" fill="#0f172a">• Switches: K1, K2, K3, K4</text>
    <text x="25" y="96" font-size="11" font-weight="500" fill="#0f172a">• Condition: K1 ∧ K2 ∧ K3 ∧ K4</text>
    <text x="25" y="116" font-size="11" font-weight="600" fill="#0284c7">• Triggers Pin 2 (TRIG &lt; 1.67V)</text>
  </g>

  <!-- Parallel Trap Input Block (OR condition) -->
  <g transform="translate(40, 270)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="150" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="115" y="26" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">TRAP KEY LOGIC</text>
    <text x="115" y="44" font-size="11" font-weight="600" fill="#ef4444" text-anchor="middle">Parallel Connection (OR)</text>
    
    <rect x="15" y="56" width="200" height="78" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
    <text x="25" y="76" font-size="11" font-weight="500" fill="#0f172a">• Switches: W1, W2, W3, W4</text>
    <text x="25" y="96" font-size="11" font-weight="500" fill="#0f172a">• Condition: W1 ∨ W2 ∨ W3 ∨ W4</text>
    <text x="25" y="116" font-size="11" font-weight="600" fill="#dc2626">• Forces Pin 4 (RESET &lt; 0.7V)</text>
  </g>

  <!-- Flow Lines to 555 IC -->
  <line x1="270" y1="165" x2="360" y2="165" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="315" y="155" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle">TRIGGER</text>

  <line x1="270" y1="345" x2="360" y2="345" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <text x="315" y="335" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">RESET / OVERRIDE</text>

  <!-- 555 Monostable Core Block -->
  <g transform="translate(365, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="330" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <text x="155" y="32" font-size="16" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">NE555 MONOSTABLE CORE</text>
    
    <!-- State 1: Standby -->
    <rect x="20" y="55" width="270" height="70" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="35" y="78" font-size="12" font-weight="700" fill="#38bdf8">STATE: STANDBY / IDLE</text>
    <text x="35" y="96" font-size="11" font-weight="500" fill="#cbd5e1">• Pin 3 (OUT) = LOW (0V)</text>
    <text x="35" y="112" font-size="11" font-weight="500" fill="#cbd5e1">• Pin 7 clamps C1 to GND via internal transistor</text>

    <!-- State 2: Active Pulse -->
    <rect x="20" y="140" width="270" height="85" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="35" y="163" font-size="12" font-weight="700" fill="#4ade80">STATE: ACTIVE TIMED PULSE</text>
    <text x="35" y="181" font-size="11" font-weight="500" fill="#cbd5e1">• Pin 3 (OUT) = HIGH (~3.7V - 5V)</text>
    <text x="35" y="197" font-size="11" font-weight="500" fill="#cbd5e1">• Pin 7 opens; C1 charges through R3</text>
    <text x="35" y="213" font-size="11" font-weight="600" fill="#86efac">• Pulse Duration T ≈ 1.1 × R3 × C1 ≈ 5.17s</text>

    <!-- State 3: Reset Priority -->
    <rect x="20" y="240" width="270" height="70" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="35" y="263" font-size="12" font-weight="700" fill="#fca5a5">PRIORITY: INSTANT RESET (PIN 4)</text>
    <text x="35" y="281" font-size="11" font-weight="500" fill="#fecaca">• Immediately resets SR latch to LOW</text>
    <text x="35" y="297" font-size="11" font-weight="500" fill="#fecaca">• Overrides Pin 2 trigger input unconditionally</text>
  </g>

  <!-- Flow Line to Output -->
  <line x1="675" y1="210" x2="740" y2="210" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowhead-green)"/>
  <text x="708" y="200" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">PIN 3</text>

  <!-- Output Actuator Block -->
  <g transform="translate(745, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="230" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">OUTPUT SYSTEM</text>
    
    <circle cx="90" cy="70" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="90" y="75" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">LED</text>
    <text x="90" y="112" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Indicator Lit for 5.2s</text>
    
    <line x1="20" y1="130" x2="160" y2="130" stroke="#86efac" stroke-width="1"/>
    <text x="90" y="152" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Optional Extension:</text>
    <text x="90" y="172" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Transistor (2N2222) +</text>
    <text x="90" y="188" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Flyback Diode (1N4007) +</text>
    <text x="90" y="204" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Solenoid / Relay Lock</text>
  </g>
</svg>
