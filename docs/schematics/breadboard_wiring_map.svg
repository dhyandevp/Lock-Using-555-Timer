<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title Banner -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="940" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="34" font-size="20" font-weight="700" fill="#0f172a">Row-by-Row Breadboard Architectural Wiring Map</text>
    <text x="915" y="34" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">MB-102 (830 Tie Points) Standard Layout</text>
  </g>

  <!-- Breadboard Body -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <!-- White Plastic Board -->
    <rect x="0" y="0" width="940" height="550" rx="16" fill="#fdfdfd" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Top Power Rails -->
    <rect x="20" y="20" width="900" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Red line (+5V) -->
    <line x1="30" y1="32" x2="910" y2="32" stroke="#ef4444" stroke-width="2"/>
    <text x="15" y="36" font-size="14" font-weight="800" fill="#dc2626">+</text>
    <!-- Blue line (GND) -->
    <line x1="30" y1="48" x2="910" y2="48" stroke="#3b82f6" stroke-width="2"/>
    <text x="15" y="52" font-size="16" font-weight="800" fill="#2563eb">-</text>
    <text x="470" y="44" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">TOP POWER DISTRIBUTION RAILS (+5V &amp; GND)</text>

    <!-- Bottom Power Rails -->
    <rect x="20" y="490" width="900" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Red line (+5V) -->
    <line x1="30" y1="502" x2="910" y2="502" stroke="#ef4444" stroke-width="2"/>
    <text x="15" y="506" font-size="14" font-weight="800" fill="#dc2626">+</text>
    <!-- Blue line (GND) -->
    <line x1="30" y1="518" x2="910" y2="518" stroke="#3b82f6" stroke-width="2"/>
    <text x="15" y="522" font-size="16" font-weight="800" fill="#2563eb">-</text>
    <text x="470" y="514" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">BOTTOM POWER DISTRIBUTION RAILS (+5V &amp; GND)</text>

    <!-- Central Divider Trough -->
    <rect x="20" y="260" width="900" height="30" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="470" y="280" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">CENTRAL BREADBOARD TROUGH (IC ISOLATION GROOVE)</text>

    <!-- Section A: 555 Timer IC & Control Subsystem (Rows 5 - 20) -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="220" height="400" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.5"/>
      <text x="110" y="22" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">ZONE 1: 555 IC &amp; TIMING</text>
      <text x="110" y="38" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Rows 10 – 14 Across Trough</text>

      <!-- DIP-8 IC Body -->
      <rect x="65" y="155" width="90" height="85" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <path d="M 65 190 A 8 8 0 0 0 65 205" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="80" cy="170" r="3" fill="#94a3b8"/>
      <text x="110" y="195" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">NE555</text>
      <text x="110" y="210" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">DIP-8</text>

      <!-- Pin Labels & Wire Annotations -->
      <!-- Left side: Pins 1 - 4 -->
      <text x="55" y="170" font-size="10" font-weight="700" fill="#2563eb" text-anchor="end">Pin 1 (GND) ──►</text>
      <text x="55" y="188" font-size="10" font-weight="700" fill="#0284c7" text-anchor="end">Pin 2 (TRIG) ──►</text>
      <text x="55" y="206" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">Pin 3 (OUT) ──►</text>
      <text x="55" y="224" font-size="10" font-weight="700" fill="#dc2626" text-anchor="end">Pin 4 (RESET) ──►</text>

      <!-- Right side: Pins 8 - 5 -->
      <text x="165" y="170" font-size="10" font-weight="700" fill="#dc2626">◄── Pin 8 (+5V)</text>
      <text x="165" y="188" font-size="10" font-weight="700" fill="#b45309">◄── Pin 7 (DISCH)</text>
      <text x="165" y="206" font-size="10" font-weight="700" fill="#b45309">◄── Pin 6 (THRESH)</text>
      <text x="165" y="224" font-size="10" font-weight="700" fill="#475569">◄── Pin 5 (CTRL)</text>

      <!-- Passive Components Around IC -->
      <!-- R1 pull-up -->
      <rect x="25" y="70" width="55" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="52" y="83" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">R1 (10k)</text>
      <!-- R2 pull-up -->
      <rect x="25" y="95" width="55" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="52" y="108" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">R2 (10k)</text>

      <!-- Timing RC: R3 & C1 -->
      <rect x="140" y="70" width="65" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="172" y="83" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">R3 (47k)</text>
      <rect x="140" y="95" width="65" height="18" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="172" y="108" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">C1 (100uF)</text>

      <!-- Decoupling: C2 & C3 -->
      <rect x="140" y="270" width="65" height="18" rx="2" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
      <text x="172" y="283" font-size="9" font-weight="700" fill="#4338ca" text-anchor="middle">C2 (10nF)</text>
      <rect x="25" y="270" width="65" height="18" rx="2" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
      <text x="57" y="283" font-size="9" font-weight="700" fill="#4338ca" text-anchor="middle">C3 (100nF)</text>

      <!-- Output: R4 & LED -->
      <rect x="65" y="315" width="90" height="20" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="110" y="329" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">R4 (330Ω) ──► LED</text>
    </g>

    <!-- Section B: 4-Key Series Combination (Rows 22 - 38) -->
    <g transform="translate(280, 75)">
      <rect x="0" y="0" width="310" height="175" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="155" y="22" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">ZONE 2: COMBINATION KEYS (K1 – K4)</text>
      <text x="155" y="38" font-size="10" font-weight="600" fill="#0284c7" text-anchor="middle">Strict Series Daisy-Chain (Only K4 touches GND)</text>

      <!-- Switch K1 -->
      <rect x="20" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="45" cy="80" r="14" fill="#0f172a"/>
      <text x="45" y="118" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">K1</text>
      <text x="45" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 24</text>

      <!-- Wire K1 -> K2 -->
      <line x1="70" y1="80" x2="90" y2="80" stroke="#0284c7" stroke-width="2.5"/>

      <!-- Switch K2 -->
      <rect x="90" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="115" cy="80" r="14" fill="#0f172a"/>
      <text x="115" y="118" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">K2</text>
      <text x="115" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 28</text>

      <!-- Wire K2 -> K3 -->
      <line x1="140" y1="80" x2="160" y2="80" stroke="#0284c7" stroke-width="2.5"/>

      <!-- Switch K3 -->
      <rect x="160" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="185" cy="80" r="14" fill="#0f172a"/>
      <text x="185" y="118" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">K3</text>
      <text x="185" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 32</text>

      <!-- Wire K3 -> K4 -->
      <line x1="210" y1="80" x2="230" y2="80" stroke="#0284c7" stroke-width="2.5"/>

      <!-- Switch K4 -->
      <rect x="230" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="255" cy="80" r="14" fill="#0f172a"/>
      <text x="255" y="118" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">K4</text>
      <text x="255" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 36</text>

      <!-- Return wire to GND -->
      <path d="M 280 80 L 295 80 L 295 15 L 295 0" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <text x="250" y="155" font-size="10" font-weight="700" fill="#2563eb">Return to GND Rail ──►</text>
    </g>

    <!-- Section C: 4-Key Parallel Reset / Trap (Rows 40 - 58) -->
    <g transform="translate(280, 290)">
      <rect x="0" y="0" width="310" height="185" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="155" y="22" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">ZONE 3: TRAP / RESET KEYS (W1 – W4)</text>
      <text x="155" y="38" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">Parallel Network (Any key pulled to GND asserts Reset)</text>

      <!-- Switch W1 -->
      <rect x="20" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      <circle cx="45" cy="80" r="14" fill="#0f172a"/>
      <text x="45" y="118" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">W1</text>
      <text x="45" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 42</text>

      <!-- Switch W2 -->
      <rect x="90" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      <circle cx="115" cy="80" r="14" fill="#0f172a"/>
      <text x="115" y="118" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">W2</text>
      <text x="115" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 46</text>

      <!-- Switch W3 -->
      <rect x="160" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      <circle cx="185" cy="80" r="14" fill="#0f172a"/>
      <text x="185" y="118" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">W3</text>
      <text x="185" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 50</text>

      <!-- Switch W4 -->
      <rect x="230" y="55" width="50" height="50" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      <circle cx="255" cy="80" r="14" fill="#0f172a"/>
      <text x="255" y="118" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">W4</text>
      <text x="255" y="130" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Row 54</text>

      <!-- Parallel Reset Bus Header Line -->
      <line x1="20" y1="48" x2="280" y2="48" stroke="#dc2626" stroke-width="2"/>
      <text x="155" y="152" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Common Input: Tied to Pin 4 Reset Bus</text>
      <text x="155" y="168" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Common Output: All Return to GND Rail</text>
    </g>

    <!-- Section D: Wiring Summary & Legend (Rows 60 - 64) -->
    <g transform="translate(615, 75)">
      <rect x="0" y="0" width="290" height="400" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="145" y="24" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">BREADBOARD RULES &amp; CHECKS</text>

      <!-- Rule 1 -->
      <rect x="15" y="45" width="260" height="75" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="65" font-size="11" font-weight="700" fill="#dc2626">1. Split Power Rail Warning</text>
      <text x="25" y="82" font-size="10" font-weight="500" fill="#475569">Most 830-point breadboards split</text>
      <text x="25" y="96" font-size="10" font-weight="500" fill="#475569">rails at Row 30. Bridge left &amp; right</text>
      <text x="25" y="110" font-size="10" font-weight="600" fill="#dc2626">halves with jumpers to avoid dead rails!</text>

      <!-- Rule 2 -->
      <rect x="15" y="130" width="260" height="75" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="150" font-size="11" font-weight="700" fill="#0284c7">2. Tactile Diagonal Rule</text>
      <text x="25" y="167" font-size="10" font-weight="500" fill="#475569">4-pin pushbuttons short horizontally.</text>
      <text x="25" y="181" font-size="10" font-weight="500" fill="#475569">Always wire jumper leads across</text>
      <text x="25" y="195" font-size="10" font-weight="600" fill="#0369a1">diagonally opposite pins (A1 to B2).</text>

      <!-- Rule 3 -->
      <rect x="15" y="215" width="260" height="75" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="235" font-size="11" font-weight="700" fill="#16a34a">3. Series Ground Isolation</text>
      <text x="25" y="252" font-size="10" font-weight="500" fill="#475569">Only Switch K4 connects to Ground.</text>
      <text x="25" y="266" font-size="10" font-weight="500" fill="#475569">K1, K2, K3 are floating in series.</text>
      <text x="25" y="280" font-size="10" font-weight="600" fill="#15803d">Prevents accidental partial-key triggers.</text>

      <!-- Rule 4 -->
      <rect x="15" y="300" width="260" height="85" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="320" font-size="11" font-weight="700" fill="#4338ca">4. IC Orientation Check</text>
      <text x="25" y="337" font-size="10" font-weight="500" fill="#475569">Physical DIP-8 notch faces LEFT/UP.</text>
      <text x="25" y="351" font-size="10" font-weight="500" fill="#475569">Pin 1 (GND) is top-left of notch.</text>
      <text x="25" y="365" font-size="10" font-weight="600" fill="#3730a3">Pin 8 (VCC) is directly opposite Pin 1.</text>
    </g>
  </g>
</svg>
